<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>TRIVIUM369 — Sala de Conversação</title>
<style>
:root{ --accent:#6366f1; --accent-soft:rgba(99,102,241,.15); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #07090f;
  background-image: radial-gradient(ellipse at 15% 0%, rgba(99,102,241,.12) 0%, transparent 55%),
                    radial-gradient(ellipse at 85% 100%, rgba(52,211,153,.08) 0%, transparent 55%);
  color: #b8c8e4;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: grid; grid-template-rows: auto auto 1fr;
  overflow: hidden;
}
/* ───── TOPO ───── */
#topo {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 15px;
  background: rgba(10,12,22,0.95);
  border-bottom: 2px solid rgba(255,255,255,0.05);
  backdrop-filter: blur(9px);
}
#brand { font-size: 0.82em; font-weight: 800; letter-spacing: 2px; color: var(--accent); white-space: nowrap; }
#brand small { color:#3a5070; font-weight:600; letter-spacing:1px; }
#dot { width: 14px; height: 14px; border-radius: 50%; background: #1e2840; flex-shrink: 0; transition: all .3s; }
#dot.on  { background: #22c55e; box-shadow: 0 0 16px rgba(34,197,94,.9); animation: pulse 0.8s infinite; }
#dot.err { background: #ef4444; box-shadow: 0 0 16px rgba(239,68,68,.7); }
#status { font-size: 0.84em; color: #3a5070; flex: 1; letter-spacing: .3px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#btn-config {
  background: rgba(20,25,45,0.8); border: 2px solid rgba(255,255,255,.08);
  color:#7c8ab0; border-radius: 10px; padding: 5px 11px; cursor: pointer;
  font-size: 1.1em; transition: all .2s; flex-shrink:0;
}
#btn-config:hover { border-color: var(--accent); color:#cdd6f4; }
/* ───── ABAS DE AGENTES ───── */
#abas {
  display: flex; gap: 6px; padding: 7px 12px; overflow-x: auto;
  background: rgba(8,10,18,.7); border-bottom: 2px solid rgba(255,255,255,.04);
}
#abas::-webkit-scrollbar { height: 4px; }
#abas::-webkit-scrollbar-thumb { background:#1e2840; border-radius:3px; }
.aba {
  display:flex; align-items:center; gap:7px; flex-shrink:0;
  padding: 6px 13px; border-radius: 11px; cursor: pointer;
  border: 2px solid var(--ac); background: transparent; color: var(--ac);
  font-weight: 700; font-size: 0.82em; transition: all .18s; white-space:nowrap;
}
.aba:hover { background: rgba(255,255,255,.04); }
.aba.ativo { background: var(--ac); color: #07090f; box-shadow: 0 0 13px -2px var(--ac); }
.aba .em { font-size: 1.05em; }
.aba .api { width:7px; height:7px; border-radius:50%; background:#33415580; }
.aba .api.ok { background:#22c55e; box-shadow:0 0 6px #22c55e; }
.aba.ativo .api { background:#07090f80; }
.aba.ativo .api.ok { background:#064e2b; }
/* ───── PAINÉIS ───── */
#paineis { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
.col { display: flex; flex-direction: column; overflow: hidden; }
#col-l { border-right: 2px solid var(--accent-soft); }
.col-h { display: flex; align-items: center; gap: 5px; flex-shrink: 0; padding: 6px 9px; }
#col-l .col-h { background: linear-gradient(90deg,#0e1330 0%, #090d1e 100%); border-bottom: 2px solid var(--accent-soft); }
#col-r .col-h { background: linear-gradient(90deg,#071a10 0%, #050d08 100%); border-bottom: 2px solid rgba(52,211,153,.18); }
.col-titulo { font-size:0.7em; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#3a5070; margin-left:auto; padding-left:7px; white-space:nowrap; flex-shrink:0; }
#col-l .col-titulo { color: var(--accent); }
.hb, .sb {
  flex: 1; padding: 8px 4px; border-radius: 9px;
  font-size: 1.0em; font-weight: 700; cursor: pointer; line-height: 1;
  white-space: nowrap; transition: all .15s; min-width: 0; text-align: center;
  border: 3px solid rgba(255,255,255,.08);
}
.hb:hover, .sb:hover { filter: brightness(1.22); transform: translateY(-2px); box-shadow: 0 5px 13px rgba(0,0,0,.4); }
.hb:active, .sb:active { transform: translateY(0); }
.hb:disabled { opacity: .25; cursor: default; filter: none; transform: none; box-shadow: none; }
#btn-lim-l, #btn-limpar-fala { background:#2c0808; color:#fca5a5; border-color:#5a1010; }
#btn-col, #btn-copiar { background:#2a1600; color:#d97706; border-color:#4a2a00; }
#btn-col.tem, #btn-copiar.tem { background:#4a2c00; color:#fde68a; border-color:#9a5a00; box-shadow:0 0 11px rgba(251,191,36,.25); }
#btn-ler-h, #btn-gravar { background:#042810; color:#4ade80; border-color:#085820; }
#btn-ler-h:disabled { opacity:.25; }
#btn-ler-h.ativo, #btn-gravar.ativo { background:#065a22; color:#bbf7d0; border-color:#0a9040; animation: pulse 1.2s infinite; }
#btn-scod, #btn-trad { background:#130828; color:#7c5ccc; border-color:#2a1050; }
#btn-scod.on, #btn-trad.on { background:#1e0e42; color:#a78bfa; border-color:#5b21b6; }
#btn-send-l, #btn-sendr { background:#001828; color:#38bdf8; border-color:#0a4a72; }
#btn-send-l.on, #btn-sendr.on { background:#001e32; color:#7dd3fc; border-color:#0a6aa2; }
#btn-format { background:#130828; color:#7c5ccc; border-color:#2a1050; }
#btn-format.on { background:#1e0e42; color:#a78bfa; border-color:#5b21b6; }
#btn-corrig { background:#001828; color:#2a8aaa; border-color:#003850; }
#btn-salvar { background:#1a1200; color:#9a7000; border-color:#3a2800; }
#btn-enviar { background:var(--accent); color:#07090f; border:3px solid var(--accent); font-weight:800; }
#btn-enviar:hover { filter:brightness(1.2); transform:translateY(-2px); }
/* slider bar */
.slider-bar { display:flex; align-items:center; gap:7px; flex-shrink:0; padding:5px 9px; border-top:2px solid rgba(99,102,241,.1); background: rgba(9,13,30,.6); }
.sl-lbl { font-size:0.74em; color:#2a3a5a; white-space:nowrap; }
.sl-sep { font-size:0.8em; color:#1a2035; }
.sl-val { font-size:0.8em; color:var(--accent); font-weight:700; min-width:30px; }
input[type=range]{ -webkit-appearance:none; appearance:none; height:4px; border-radius:3px; flex:1; background:#1a2035; cursor:pointer; outline:none; min-width:40px; }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); cursor:pointer; border:3px solid #07090f; box-shadow:0 0 7px var(--accent); }
/* área leitura */
.area-l { flex:1; overflow-y:auto; padding:16px 18px; font-size:1.02em; line-height:1.9; color:#3e5070; background:#07090f; }
.area-l::-webkit-scrollbar { width:5px; }
.area-l::-webkit-scrollbar-thumb { background:#1e2840; border-radius:3px; }
.area-l strong { color:#a5b4fc; }
.area-l code { background:#0d1425; padding:2px 6px; border-radius:4px; color:#67e8f9; font-size:0.98em; }
.area-l h1,.area-l h2,.area-l h3 { color:var(--accent); margin:11px 0 6px; }
.area-l p { margin-bottom:9px; }
.ph { color:#1a2335; text-align:center; margin-top:42px; font-size:1.02em; letter-spacing:1.5px; line-height:1.8; }
.frase { display:inline; cursor:pointer; border-radius:5px; padding:2px 0; line-height:1.95; color:#3e5070; transition:background .12s, color .12s; }
.frase:hover { background:rgba(99,102,241,.07); color:#6070a0; }
.frase.ativa { color:#dce4f8; }
.frase.ativa .pw.cur { background:#4c1d95; color:#e9d5ff; border-radius:4px; padding:0 4px; box-shadow:0 0 11px rgba(91,33,182,.6); }
.pw { display:inline; cursor:pointer; border-radius:4px; transition:background .1s; }
.pw:hover { background:rgba(99,102,241,.18); }
h3.frase-h { color:var(--accent); font-size:1.32em; font-weight:700; margin:14px 0 6px; cursor:pointer; border-left:4px solid var(--accent); padding-left:11px; display:block; border-radius:0 6px 6px 0; transition:all .15s; }
h4.frase-h { color:var(--accent); font-size:1.05em; font-weight:600; margin:10px 0 4px; cursor:pointer; border-left:3px solid var(--accent); padding-left:9px; display:block; }
h3.frase-h:hover, h4.frase-h:hover { background:rgba(99,102,241,.06); }
.frase-li { color:#3e5070; cursor:pointer; padding:4px 6px; margin:3px 0 3px 11px; border-radius:6px; display:block; font-size:1.02em; transition:all .15s; }
.frase-li:hover { color:#6878a8; background:rgba(255,255,255,.025); }
.frase-li.ativa { color:#dce4f8; background:rgba(99,102,241,.07); }
/* player */
.player { flex-shrink:0; padding:8px 12px 6px; border-top:2px solid rgba(99,102,241,.1); background: linear-gradient(90deg,#09101e,#07090f); }
.player-line { display:flex; align-items:center; gap:5px; }
.pbtn { flex:1; padding:7px 5px; border-radius:9px; border:2px solid rgba(99,102,241,.15); background:rgba(99,102,241,.06); color:#3a4a70; cursor:pointer; font-size:1.05em; text-align:center; transition:all .15s; }
.pbtn:disabled { opacity:.15; cursor:not-allowed; }
.pbtn:not(:disabled):hover { background:var(--accent-soft); color:#a5b4fc; border-color:var(--accent); transform:translateY(-2px); }
.p-play { border-color:rgba(99,102,241,.3); color:var(--accent); background:rgba(99,102,241,.1); }
.p-play.stop { background:rgba(79,46,220,.25); color:#c4b5fd; border-color:rgba(99,102,241,.5); }
.prog { font-size:0.78em; color:#1e2a42; margin-left:5px; white-space:nowrap; }
.prog span { color:var(--accent); font-weight:700; }
/* player ronei (fala) */
#player-r { display:flex; align-items:center; gap:5px; padding:8px 9px 6px; flex-shrink:0; border-top:2px solid rgba(52,211,153,.08); background: linear-gradient(90deg,#040e08,#07090f); }
#player-r .pbtn { border-color:rgba(52,211,153,.15); color:#1a6040; background:rgba(52,211,153,.04); }
#player-r .pbtn:not(:disabled):hover { background:rgba(52,211,153,.15); color:#34d399; border-color:rgba(52,211,153,.4); }
#fr-play { border-color:rgba(34,197,94,.28)!important; color:#22c55e!important; background:rgba(34,197,94,.08)!important; }
#fr-play.stop { background:rgba(22,163,74,.2)!important; color:#4ade80!important; }
/* área fala */
#fala-txt { flex:1; resize:none; border:none; outline:none; background:#07090f; color:#c0d0e8; font-family:'Segoe UI', system-ui, sans-serif; font-size:1.08em; line-height:1.85; padding:16px 18px; }
#fala-txt::placeholder { color:#141e2e; }
#fala-txt::-webkit-scrollbar { width:5px; }
#fala-txt::-webkit-scrollbar-thumb { background:#1e2840; border-radius:3px; }
#fala-preview { flex:1; overflow-y:auto; padding:16px 18px; display:none; font-size:1.04em; line-height:1.9; color:#a0b4cc; background:#07090f; }
#interim-bar { padding:5px 16px; font-size:0.9em; color:#1a5a2a; font-style:italic; min-height:20px; flex-shrink:0; border-top:2px solid rgba(0,0,0,.25); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
/* código colorido */
.code-block { display:block; margin:9px 0; border-radius:11px; overflow:hidden; border:2px solid rgba(139,92,246,.09); background:rgba(139,92,246,.015); }
.code-block.code-skip { background:rgba(139,92,246,.01); border-color:rgba(139,92,246,.07); opacity:.85; }
.code-header { display:flex; align-items:center; gap:9px; padding:6px 13px; background:rgba(0,0,0,.4); font-size:0.82em; min-height:31px; }
.code-lang { color:#34d399; font-family:monospace; text-transform:uppercase; letter-spacing:2px; flex-shrink:0; }
.skip-badge { background:rgba(251,191,36,.12); color:#fbbf24; font-size:0.9em; font-weight:700; padding:3px 10px; border-radius:11px; flex-shrink:0; border:2px solid rgba(251,191,36,.2); }
.btn-ler-cod { flex:1; background:var(--accent-soft); color:#818cf8; border:2px solid rgba(99,102,241,.22); cursor:pointer; font-size:0.9em; padding:5px 11px; border-radius:8px; font-weight:700; text-align:center; transition:all .2s; }
.btn-ler-cod:hover { background:rgba(99,102,241,.25); color:#a5b4fc; }
.code-block pre { margin:0; padding:13px 15px; font-family:'Cascadia Code','Consolas',monospace; font-size:0.88em; line-height:1.65; color:#6ee77a; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
.code-skip pre { color:#4a3a18; }
.code-block.ativa { border-color:rgba(129,140,248,.5)!important; box-shadow:0 0 19px rgba(99,102,241,.2); }
.ck-kw{color:#ff79c6;font-weight:600}.ck-str{color:#f1fa8c}.ck-num{color:#bd93f9}.ck-cmt{color:#6272a4;font-style:italic}.ck-pun{color:#f8f8f2}.ck-op{color:#ff79c6}.ck-dec{color:#50fa7b}.ck-bi{color:#8be9fd}.ck-tag{color:#ff5555}.ck-atr{color:#50fa7b}
/* modal config */
#modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:1000; align-items:center; justify-content:center; padding:14px; }
#modal.on { display:flex; }
.modal-box { background:#0c1020; border:2px solid rgba(255,255,255,.08); border-radius:16px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; padding:18px; }
.modal-box::-webkit-scrollbar { width:6px; } .modal-box::-webkit-scrollbar-thumb { background:#1e2840; border-radius:3px; }
.modal-box h2 { color:#cdd6f4; font-size:1.05em; margin-bottom:4px; }
.modal-box .sub { color:#3a5070; font-size:0.8em; margin-bottom:14px; line-height:1.5; }
.cfg-ag { border:2px solid var(--ac); border-radius:11px; padding:11px 12px; margin-bottom:11px; }
.cfg-ag h3 { font-size:0.92em; color:var(--ac); display:flex; align-items:center; gap:7px; margin-bottom:8px; }
.cfg-ag .meta { font-size:0.72em; color:#475569; font-weight:600; margin-left:auto; }
.cfg-row { margin-bottom:8px; }
.cfg-row label { display:block; font-size:0.72em; color:#64748b; margin-bottom:3px; font-weight:600; }
.cfg-row input, .cfg-row select { width:100%; background:#070a16; border:2px solid #1e2840; color:#cdd6f4; padding:7px 9px; border-radius:7px; font-size:0.85em; outline:none; }
.cfg-row input:focus, .cfg-row select:focus { border-color:var(--ac); }
.cfg-cols { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.modal-foot { display:flex; gap:8px; margin-top:6px; }
.mbtn { flex:1; padding:10px; border-radius:9px; cursor:pointer; font-weight:700; font-size:0.86em; border:2px solid; }
.mbtn.prim { background:var(--accent); color:#07090f; border-color:var(--accent); }
.mbtn.sec { background:rgba(255,255,255,.04); color:#94a3b8; border-color:rgba(255,255,255,.1); }
/* responsivo */
@media (max-width: 820px) {
  #paineis { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  #col-l { border-right:none; border-bottom:2px solid var(--accent-soft); }
  .col-titulo { display:none; }
  .cfg-cols { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="topo">
  <div id="dot"></div>
  <div id="brand">TRIVIUM369 <small>· Sala</small></div>
  <span id="status">Iniciando…</span>
  <button id="btn-config" onclick="abrirConfig()" title="Configurações (chaves API e vozes)">⚙</button>
</div>

<div id="abas"><!-- abas dos agentes geradas via JS --></div>

<div id="paineis">
  <!-- COLUNA ESQUERDA: RESPOSTA DO AGENTE -->
  <div class="col" id="col-l">
    <div class="col-h">
      <button class="hb" id="btn-lim-l" onclick="limparLeitura()" title="Limpar leitura">🗑</button>
      <button class="hb" id="btn-col" onclick="colarLeitura()" title="Colar resposta (Ctrl+V na área)">📋</button>
      <button class="hb" id="btn-ler-h" onclick="togglePlay()" title="Ler / Pausar">▶</button>
      <button class="sb" id="btn-scod" onclick="toggleSup('cod')" title="Ler / Não ler código">{ }</button>
      <button class="sb" id="btn-send-l" onclick="toggleSup('end')" title="Suprimir endereços (absolutos e relativos)">📁</button>
      <button class="sb" id="btn-trad" onclick="toggleSup('url')" title="Suprimir URLs">🔗</button>
      <span class="col-titulo" id="col-l-titulo">Resposta</span>
    </div>
    <div id="area-l" class="area-l"><p class="ph">Selecione um agente acima.<br>Cole a resposta dele aqui — ou clique Enviar para chamar a IA.</p></div>
    <div id="player" class="player">
      <div class="player-line">
        <button class="pbtn" id="p-prev" onclick="prevFrase()" disabled title="Frase anterior">⏮</button>
        <button class="pbtn p-play" id="p-play" onclick="togglePlay()" title="Ler / Pausar">▶</button>
        <button class="pbtn" id="p-stop" onclick="pararLeitura()" disabled title="Parar">⏹</button>
        <button class="pbtn" id="p-next" onclick="nextFrase()" disabled title="Próxima frase">⏭</button>
        <div id="prog" class="prog">—</div>
      </div>
    </div>
    <div id="slider-bar" class="slider-bar">
      <span class="sl-lbl">Vel</span>
      <input type="range" id="vel" min="0.5" max="4" step="0.1" value="1.6" oninput="onSlider()">
      <span class="sl-val" id="velVal">1.6</span><span class="sl-lbl">×</span>
      <span class="sl-sep">·</span>
      <span class="sl-lbl">Tom</span>
      <input type="range" id="tom" min="0.6" max="1.4" step="0.05" value="1" oninput="onSlider()">
      <span class="sl-val" id="tomVal">1.00</span>
    </div>
  </div>

  <!-- COLUNA DIREITA: SUA FALA (RONEI) -->
  <div class="col" id="col-r">
    <div class="col-h">
      <button class="hb" id="btn-limpar-fala" onclick="limparFala()" title="Limpar texto">🗑</button>
      <button class="hb" id="btn-copiar" onclick="copiarFala()" title="Copiar texto">📋</button>
      <button class="hb" id="btn-gravar" onclick="toggleGravar()" title="Ditar (voz→texto)">🎙</button>
      <button class="sb" id="btn-format" onclick="formatarTexto()" title="Preview Markdown">MD</button>
      <button class="sb" id="btn-corrig" onclick="corrigirTexto()" title="Corrigir texto">✏</button>
      <button class="sb" id="btn-salvar" onclick="salvarTexto()" title="Salvar .md">SV</button>
      <button class="sb" id="btn-enviar" onclick="enviar()" title="Enviar para o agente ativo">➤</button>
      <span class="col-titulo">Ronei</span>
    </div>
    <textarea id="fala-txt" spellcheck="true" lang="pt-BR" placeholder="Fale ou escreva aqui…&#10;Espaço = ditar. Enter no campo quebra linha; use ➤ para enviar."></textarea>
    <div id="fala-preview"></div>
    <div id="interim-bar"></div>
    <div id="player-r">
      <button class="pbtn" id="fr-play" onclick="ouvirFala()" title="Ouvir seu texto">▶</button>
      <button class="pbtn" id="fr-stop" onclick="pararFalaTTS()" title="Parar">⏹</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIG -->
<div id="modal">
  <div class="modal-box">
    <h2>⚙ Configurações da Sala</h2>
    <div class="sub">Chave API e voz de cada agente. As chaves ficam <b>só neste navegador</b> (localStorage) — nunca vão para o repositório.</div>
    <div id="cfg-lista"></div>
    <div class="modal-foot">
      <button class="mbtn prim" onclick="salvarConfig()">Salvar</button>
      <button class="mbtn sec" onclick="fecharConfig()">Fechar</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   ROSTER DE AGENTES — identidade, voz, LLM e persona de cada um.
   Trocar provedor/modelo/voz de um agente é só editar aqui.
   ═══════════════════════════════════════════════════════════════ */
var AGENTS = {
  claudio: {
    nome:'Claudio', emoji:'🧠', papel:'Arquiteto · raciocínio profundo', cor:'#6366f1',
    provider:'anthropic', model:'claude-opus-4-8',
    voiceHint:['daniel','luciana','google português','microsoft'], rate:1.5, pitch:1.0,
    system:'Você é Claudio, o arquiteto-chefe do TRIVIUM369. Raciocínio longo, decisões de arquitetura, código complexo e revisão crítica. Seja analítico, estruturado e honesto sobre incertezas; dê uma recomendação clara em vez de listar opções. Responda em português do Brasil.'
  },
  pedrinho: {
    nome:'Pedrinho', emoji:'🛠️', papel:'Dev EA/MQL5 · MetaTrader 5', cor:'#22c55e',
    provider:'deepseek', model:'deepseek-chat',
    voiceHint:['daniel','antonio','google português','microsoft'], rate:1.7, pitch:0.95,
    system:'Você é Pedrinho (Dr. Pedro), desenvolvedor de Expert Advisors em MQL5 para MetaTrader 5 no projeto TRIVIUM369. Entregue código pronto para colar, objetivo e comentado. Foque em automação de trading, EAs, indicadores e otimização. Responda em português do Brasil.'
  },
  kairos: {
    nome:'Kairos', emoji:'📊', papel:'Orquestrador de trading · mercado', cor:'#fb923c',

/* ════════════════════ HELPERS DE TEXTO ════════════════════ */
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripUrls(t){ return t.replace(/https?:\/\/[^\s<>"'»«\]]+/g,'').replace(/www\.[^\s<>"'»«\]]+/g,'').replace(/\s{2,}/g,' ').trim(); }
function removeEmojis(t){ return t.replace(/(\ud83c[\udc00-\udfff]|\ud83d[\udc00-\udfff]|\ud83e[\udc00-\udfff]|\ud83f[\udc00-\udfff])/g,'').replace(/[☀-➿]/g,'').trim(); }
function stripMD(t){ return t.replace(/\*\*(.*?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/__(.*?)__/g,'$1').trim(); }
/* endereços ABSOLUTOS */
function stripAbs(t){
  return t.replace(/[A-Za-z]:[\\\/][^\s,;'"<>&\n]*/g,'')
          .replace(/\/(?:Users|home|var|etc|opt|usr|tmp|root|mnt|srv|bin|lib)[^\s,;'"<>&\n]*/g,'');
}
/* endereços RELATIVOS — conservador: só ./ ../ ou tokens com extensão de arquivo */
function stripRel(t){
  return t.replace(/\.{1,2}\/[\w.\-\/]+/g,'')                       // ./x  ../x/y
          .replace(/\b[\w-]+(?:\/[\w-]+)+\.[A-Za-z0-9]{1,6}\b/g,'') // pasta/sub/arquivo.ext
          .replace(/\b[\w-]+\/[\w./-]*\.[A-Za-z0-9]{1,6}\b/g,'');   // pasta/arquivo.ext
}
function stripEnderecos(t){ return stripAbs(stripRel(t)).replace(/\s{2,}/g,' ').trim(); }
/* limpeza p/ fala (markdown, lixo) */
function stripJunk(t){
  return t.replace(/`[^`\n]+`/g,'')
          .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
          .replace(/^#{1,6}\s+/gm,'').replace(/^[-*]\s+/gm,'')
          .replace(/^[ \t]*([+\-=\/\\|*_#~]{3,})[ \t]*$/gm,'')
          .replace(/\n{2,}/g,'. ').replace(/\n/g,' ').replace(/\s{2,}/g,' ').trim();
}
function renderMDi(t){ return escHTML(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function parseSegments(raw){
  var segs=[], txt=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var re=/```([^\n]*)[ \t]*\n([\s\S]*?)```/g, last=0, m;
  while((m=re.exec(txt))!==null){ if(m.index>last) segs.push({type:'text',content:txt.slice(last,m.index)}); segs.push({type:'code',lang:(m[1]||'code').trim(),content:m[2].trim()}); last=m.index+m[0].length; }
  if(last<txt.length) segs.push({type:'text',content:txt.slice(last)});
  return segs;
}
function highlightCode(raw, lang){
  var l=(lang||'').toLowerCase();
  var kwJS=/^(function|var|const|let|if|else|return|for|while|do|class|new|this|typeof|instanceof|import|export|default|from|of|in|try|catch|finally|throw|async|await|yield|switch|case|break|continue|null|undefined|true|false|void|delete|require|module|console|Promise|Object|Array|Math|JSON|process|window|document)\b/;
  var kwPY=/^(def|class|if|elif|else|return|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|pass|break|continue|lambda|yield|True|False|None|self|super|print|len|range|type|str|int|float|list|dict|set|tuple)\b/;
  var kwMQL=/^(input|extern|datetime|color|bool|int|double|string|void|long|ulong|uchar|enum|struct|class|if|else|for|while|switch|case|break|continue|return|true|false|NULL|OrderSend|iMA|iRSI|OnTick|OnInit|OnDeinit|PositionOpen|SymbolInfoDouble)\b/;
  var kwRe=/^py/.test(l)?kwPY:/(mq|mt|mql)/.test(l)?kwMQL:kwJS;
  var builtins=/^(console\.log|console\.error|document\.getElementById|require|setTimeout|setInterval|parseInt|parseFloat|isNaN|fetch|JSON\.parse|JSON\.stringify|Object\.keys|Math\.floor|Math\.round)\b/;
  var pats;
  if(/^html?$/i.test(l)){
    pats=[{t:'cmt',r:/^<!--[\s\S]*?-->/},{t:'tag',r:/^<\/?[\w:-]+/},{t:'pun',r:/^\/?>/},{t:'atr',r:/^[\w:-]+(?=\s*=)/},{t:'str',r:/^"[^"]*"/},{t:'str',r:/^'[^']*'/},{t:'num',r:/^\b\d+\.?\d*\b/},{t:null,r:/^[\s\S]/}];
  }else{
    pats=[{t:'cmt',r:/^#[^\n]*/},{t:'cmt',r:/^\/\/[^\n]*/},{t:'cmt',r:/^\/\*[\s\S]*?\*\//},{t:'str',r:/^`[\s\S]*?`/},{t:'str',r:/^"(?:\\.|[^"\\])*"/},{t:'str',r:/^'(?:\\.|[^'\\])*'/},{t:'num',r:/^\b0x[\da-fA-F]+\b/},{t:'num',r:/^\b\d+\.?\d*([eE][+-]?\d+)?\b/},{t:'bi',r:builtins},{t:'kw',r:kwRe},{t:'dec',r:/^(\w+)(?=\s*\()/},{t:'pun',r:/^[{}()\[\];,]/},{t:'op',r:/^[=+\-*\/<>!&|^~?:.@]+/},{t:null,r:/^[\s\S]/}];
  }
  var out='', rem=raw;
  while(rem.length){ for(var i=0;i<pats.length;i++){ var m=pats[i].r.exec(rem); if(m){ var txt=escHTML(m[0]); out+=pats[i].t?'<span class="ck-'+pats[i].t+'">'+txt+'</span>':txt; rem=rem.slice(m[0].length); break; } } }
  return out;
}

var leituraOrig='', semCod=false, semEnd=false, semUrl=false;

function colarLeitura(){

    navigator.clipboard.readText().then(function(txt){ leituraOrig=txt; buildLeitura(txt); }).catch(function(){ setStatus('Permita o acesso à área de transferência.','err'); });
  }

function buildLeitura(raw){
  var src=raw;
  if(semCod){ src=src.replace(/```[\s\S]*?```/g,'').replace(/`[^`\n]+`/g,'').replace(/\n{3,}/g,'\n\n'); }
  if(semEnd) src=stripEnderecos(src);
  if(semUrl) src=stripUrls(src);
  var segs=parseSegments(src);
  frases=[]; fraseDisplays=[]; fraseIdx=0; charOffset=0;
  var html='', fc=0, _para=[];
  function _addPara(){
    if(!_para.length) return; var joined=_para.join(' '); _para=[]; if(!joined.trim()) return;
    var sents=joined.match(/[^.!?\n]+[.!?\n]*/g)||[joined];
    sents.forEach(function(sent){
      var s=sent.trim(); if(!s) return;
      var t=stripMD(stripJunk(s)); if(semEnd) t=stripEnderecos(t); if(t.length<2) return;
      var disp=renderMDi(s);
      fraseDisplays.push(disp);
      html+='<span class="frase" id="fr_'+fc+'" onclick="pularPara('+fc+')">'+disp+' </span>';
      frases.push(t); fc++;
    });
  }
  segs.forEach(function(seg){
    if(seg.type==='code'){
      _addPara();
      var lang=(seg.lang||'code').toUpperCase(); var idx=fc++;
      frases.push(seg.content.replace(/\n/g,' ').replace(/\s{2,}/g,' ').trim()); fraseDisplays.push(null);
      var linhas=seg.content.split('\n'), linhasHTML='';
      linhas.forEach(function(linha,li){
        linhasHTML+='<div style="display:flex;align-items:flex-start;gap:12px"><span style="color:#2a3a5a;font-size:0.85em;min-width:32px;text-align:right;flex-shrink:0;user-select:none;padding-top:1px">'+(li+1)+'</span><code style="flex:1;display:block;overflow-x:auto">'+highlightCode(linha,seg.lang)+'</code></div>';
      });
      html+='<div class="code-block code-skip" id="fr_'+idx+'"><div class="code-header"><span class="code-lang">'+escHTML(lang)+'</span><span class="skip-badge">⏭ código</span><button class="btn-ler-cod" onclick="event.stopPropagation();pularPara('+idx+')">▶ Ler este bloco</button></div><pre style="padding:13px 0;margin:0"><div style="padding:0 15px">'+linhasHTML+'</div></pre></div>';
    }else{
      seg.content.split('\n').forEach(function(l){
        var ln=l.trim();
        if(!ln){ _addPara(); return; }
        if(/^\|.+\|/.test(ln)){
          if(/^[\s|:-]+$/.test(ln)) return;
          _addPara();
          var cells=ln.split('|').slice(1,-1).map(function(c){ return c.trim(); }).filter(Boolean);
          if(!cells.length) return;
          var tRow=cells.join(', ');
          var dispRow=cells.map(function(c){ return '<span style="color:#8080b0">'+renderMDi(c)+'</span>'; }).join(' <span style="color:#334">│</span> ');
          html+='<div class="frase frase-li" id="fr_'+fc+'" onclick="pularPara('+fc+')">'+dispRow+'</div>';
          frases.push(tRow); fraseDisplays.push(dispRow); fc++; return;
        }
        var hm=ln.match(/^(#{1,4})\s+(.+)/);
        if(hm){ _addPara(); var t=stripMD(hm[2]); var tag=hm[1].length<=2?'h3':'h4';
          html+='<'+tag+' class="frase frase-h" id="fr_'+fc+'" onclick="pularPara('+fc+')">'+renderMDi(hm[2])+'</'+tag+'>';
          frases.push(t); fraseDisplays.push(renderMDi(hm[2])); fc++; return; }
        if(/^[-*•]\s+/.test(ln)){ _addPara(); var raw2=ln.replace(/^[-*•]\s+/,'');
          html+='<div class="frase frase-li" id="fr_'+fc+'" onclick="pularPara('+fc+')">› '+renderMDi(raw2)+'</div>';
          frases.push(stripMD(raw2)); fraseDisplays.push('› '+renderMDi(raw2)); fc++; return; }
        _para.push(ln);
      });
      _addPara();
    }
  });
  document.getElementById('area-l').innerHTML = html || '<p class="ph">Sem texto</p>';
  setPlayer(frases.length>0); atualizarProg();
  document.getElementById('btn-col').classList.toggle('tem', frases.length>0);
}

function pularPara(i){ speechSynthesis.cancel(); leituraAtiva=false; pausado=false; fraseIdx=i; charOffset=0; lerFrase(); }

function ativarFrase(idx){
  document.querySelectorAll('.frase.ativa').forEach(function(el){ var i=parseInt(el.id.replace('fr_','')); if(!isNaN(i)&&fraseDisplays[i]) el.innerHTML=fraseDisplays[i]+(el.tagName==='SPAN'?' ':''); el.classList.remove('ativa'); });
  document.querySelectorAll('.pw.cur').forEach(function(w){ w.classList.remove('cur'); });
  var el=document.getElementById('fr_'+idx); if(!el){ wordPos=[]; return; }
  el.classList.add('ativa'); el.scrollIntoView({behavior:'smooth',block:'center'});
  if(el.classList.contains('code-block')){ wordPos=[]; return; }
  wordPos=[]; var txt=frases[idx], pos=0, whtml='';
  txt.split(/(\s+)/).forEach(function(tok,wi){
    if(!tok) return;
    if(/^\s+$/.test(tok)){ whtml+=tok; pos+=tok.length; }
    else{ var wid='w_'+idx+'_'+wi, cp=pos; whtml+='<span class="pw" id="'+wid+'" onclick="event.stopPropagation();pularPalavra('+idx+','+cp+')">'+escHTML(tok)+'</span>'; wordPos.push({start:pos,end:pos+tok.length,id:wid}); pos+=tok.length; }
  });
  el.innerHTML=whtml+(el.tagName==='SPAN'?' ':'');
}
function deveSkip(idx){ if(idx>=frases.length) return false; var tts=frases[idx]; if(!tts||!tts.trim()) return true; var el=document.getElementById('fr_'+idx); if(semCod&&el&&el.classList.contains('code-block')) return true; return false; }
function lerFrase(){
  while(fraseIdx<frases.length&&deveSkip(fraseIdx)){ fraseIdx++; atualizarProg(); }
  if(fraseIdx>=frases.length){ pararLeitura(); return; }
  pausado=false; leituraAtiva=true;
  document.getElementById('p-play').textContent='⏸'; document.getElementById('p-play').className='pbtn p-play stop';
  var bh=document.getElementById('btn-ler-h'); bh.textContent='⏸'; bh.classList.add('ativo');
  ativarFrase(fraseIdx);
  var co=charOffset; charOffset=0; var full=frases[fraseIdx]; var txt=co>0?full.slice(co):full;
  var utt=new SpeechSynthesisUtterance(txt);
  utt.lang='pt-BR'; utt.rate=parseFloat(document.getElementById('vel').value)||1.6; utt.pitch=parseFloat(document.getElementById('tom').value)||1.0;
  var voz=vozDe(agente); if(voz) utt.voice=voz;
  setStatus('▶ '+AGENTS[agente].nome+' lendo…','');
  utt.onboundary=function(e){ if(e.name!=='word') return; var adj=e.charIndex+co; document.querySelectorAll('.pw.cur').forEach(function(w){ w.classList.remove('cur'); }); var wp=wordPos.find(function(w){ return adj>=w.start&&adj<w.end; }); if(wp){ var we=document.getElementById(wp.id); if(we) we.classList.add('cur'); } };
  utt.onend=function(){ if(!pausado){ fraseIdx++; atualizarProg(); setTimeout(lerFrase,70); } };
  utt.onerror=function(e){ if(e.error==='interrupted'||e.error==='canceled') return; leituraAtiva=false; };
  atualizarProg(); speechSynthesis.speak(utt);
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, gravando=false, textoBase='';

function corrigirTranscript(t){ for(var k in DICIONAR){ t=t.replace(new RegExp('\\b'+k+'\\b','gi'), DICIONAR[k]); } return t; }
function initRec(){
  rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=function(e){
    if(!gravando) return;
    var el=document.getElementById('fala-txt'), ib=document.getElementById('interim-bar'), parcial='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=corrigirTranscript(e.results[i][0].transcript.trim());
      if(e.results[i].isFinal){
        var ini=el.selectionStart, fim=el.selectionEnd;
        if(ini!==fim){ el.value=el.value.substring(0,ini)+t+' '+el.value.substring(fim); textoBase=el.value; var np=ini+t.length+1; setTimeout(function(){ el.selectionStart=el.selectionEnd=np; },0); }
        else { el.value=(textoBase||'')+t+' '; textoBase=el.value; }
        el.scrollTop=el.scrollHeight; salvarBackup(); atualizarCopiar();
      } else parcial=t;
    }
    if(ib) ib.textContent=parcial?'◉ '+parcial:'';
  };
  rec.onerror=function(e){ if(e.error==='no-speech'||e.error==='aborted') return; setStatus('⚠ '+e.error,'err'); };
  rec.onend=function(){ setTimeout(function(){ try{ rec.start(); }catch(x){} },200); };
  try{ rec.start(); }catch(x){}
}
function toggleGravar(){ gravando?pararGravacao():iniciarGravacao(); }
function iniciarGravacao(){ if(!SR){ setStatus('❌ Use Chrome ou Edge para ditar','err'); return; } if(!rec) initRec(); gravando=true; textoBase=document.getElementById('fala-txt').value; var b=document.getElementById('btn-gravar'); b.textContent='⏹'; b.classList.add('ativo'); document.getElementById('dot').className='on'; setStatus('🎙 Ouvindo…','on'); }
function pararGravacao(){ gravando=false; var b=document.getElementById('btn-gravar'); b.textContent='🎙'; b.classList.remove('ativo'); document.getElementById('dot').className=''; document.getElementById('interim-bar').textContent=''; setStatus('Parado · Espaço para retomar',''); }
function setStatus(msg,cls){ document.getElementById('status').textContent=msg; if(cls!==undefined && (cls==='on'||cls==='err'||cls==='')) document.getElementById('dot').className = (cls==='on'?'on':cls==='err'?'err':(gravando?'on':'')); }
function copiarFala(){ navigator.clipboard.writeText(document.getElementById('fala-txt').value.trim()).then(function(){ setStatus('✅ Copiado!',''); }); }
function limparFala(){ document.getElementById('fala-txt').value=''; textoBase=''; localStorage.removeItem('triv_fala'); atualizarCopiar(); }
function salvarBackup(){ try{ localStorage.setItem('triv_fala', document.getElementById('fala-txt').value); }catch(x){} }
function atualizarCopiar(){ document.getElementById('btn-copiar').classList.toggle('tem', document.getElementById('fala-txt').value.trim().length>0); }
var formModo=false;
function formatarTexto(){
  formModo=!formModo; document.getElementById('btn-format').classList.toggle('on',formModo);
  var ta=document.getElementById('fala-txt'), prev=document.getElementById('fala-preview');
  if(formModo){
    var html=ta.value.split(/\n{2,}/).map(function(b){ b=b.trim(); if(!b) return '';
      if(/^#{1,6}\s/.test(b)){ var m=b.match(/^(#{1,6})\s+(.*)/); var lv=Math.min(m[1].length+1,4); return '<h'+lv+'>'+escHTML(m[2])+'</h'+lv+'>'; }
      if(/^[-*]\s/.test(b)){ return '<ul>'+b.split('\n').filter(Boolean).map(function(l){ return '<li>'+renderMDi(l.replace(/^[-*]\s+/,''))+'</li>'; }).join('')+'</ul>'; }
      return '<p>'+renderMDi(b.replace(/\n/g,'<br>'))+'</p>'; }).join('');
    prev.innerHTML=html||'<p style="color:#333">Sem texto</p>'; ta.style.display='none'; prev.style.display='block';
  }else{ ta.style.display=''; prev.style.display='none'; }
}
function salvarTexto(){ var txt=document.getElementById('fala-txt').value.trim(); if(!txt){ setStatus('⚠ Nada para salvar',''); return; } var ts=new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,''); var nome='ronei_'+ts+'.md'; var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/markdown;charset=utf-8'})); a.download=nome; a.click(); setStatus('💾 Salvo: '+nome,''); }
function corrigirTexto(){
  var ta=document.getElementById('fala-txt'), txt=ta.value; if(!txt.trim()) return;
  txt=txt.replace(/\b(hm+|hmm+|ã{2,}|né isso|ne que|então então|ah ah|ok ok|hem)\b/gi,'');
  txt=txt.replace(/\s+([.,!?;:])/g,'$1').replace(/([.,!?;:])([^\s\d"'\)\]\n])/g,'$1 $2');
  txt=txt.replace(/([.!?]\s+)(\w)/g,function(m,p,l){ return p+l.toUpperCase(); });
  txt=txt.replace(/(^|\n)(\s*)(\w)/g,function(m,nl,sp,l){ return nl+sp+l.toUpperCase(); });
  txt=txt.replace(/[ \t]{2,}/g,' ').trim(); if(txt&&!/[.!?]$/.test(txt)) txt+='.';
  ta.value=txt; textoBase=txt; salvarBackup(); setStatus('✅ Corrigido','');
}
var falaTTSAtiva=false;
function ouvirFala(){
  var btn=document.getElementById('fr-play');
  if(falaTTSAtiva){ speechSynthesis.cancel(); falaTTSAtiva=false; btn.textContent='▶'; btn.classList.remove('stop'); return; }
  var txt=document.getElementById('fala-txt').value.trim(); if(!txt){ setStatus('⚠ Nada para ouvir',''); return; }
  if(leituraAtiva) pararLeitura(); speechSynthesis.cancel(); falaTTSAtiva=true; btn.textContent='⏸'; btn.classList.add('stop');
  var utt=new SpeechSynthesisUtterance(removeEmojis(txt)); utt.lang='pt-BR';
  utt.rate=parseFloat(document.getElementById('vel').value)||1.6; utt.pitch=1.0;
  var voz=vozDe(agente); if(voz) utt.voice=voz;
  utt.onend=utt.onerror=function(e){ if(e.type==='error'&&(e.error==='interrupted'||e.error==='canceled')) return; falaTTSAtiva=false; btn.textContent='▶'; btn.classList.remove('stop'); };
  speechSynthesis.speak(utt);
}
function pararFalaTTS(){ speechSynthesis.cancel(); falaTTSAtiva=false; var b=document.getElementById('fr-play'); if(b){ b.textContent='▶'; b.classList.remove('stop'); } }

/* ════════════════════ CHAMADAS LLM ════════════════════ */
function temChave(id){ return !!localStorage.getItem('triv_key_'+id); }
function chave(id){ return localStorage.getItem('triv_key_'+id)||''; }
function modeloDe(id){ return localStorage.getItem('triv_model_'+id) || AGENTS[id].model; }
AGENTS.__hist = {}; // histórico por agente

async function chamarLLM(id, texto){
  var ag=AGENTS[id], key=chave(id), model=modeloDe(id);
  if(!AGENTS.__hist[id]) AGENTS.__hist[id]=[];
  var hist=AGENTS.__hist[id];
  hist.push({role:'user', content:texto});
  var resposta='';
  if(ag.provider==='anthropic'){
    var r=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST', headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({ model:model, max_tokens:4096, system:ag.system, messages:hist }) });
    if(!r.ok) throw new Error('Anthropic '+r.status+' '+(await r.text()).slice(0,140));
    var d=await r.json(); resposta=(d.content||[]).map(function(b){ return b.text||''; }).join('');
  } else if(ag.provider==='gemini'){
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key);
    var contents=hist.map(function(m){ return { role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] }; });
    var rg=await fetch(url,{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ systemInstruction:{parts:[{text:ag.system}]}, contents:contents }) });
    if(!rg.ok) throw new Error('Gemini '+rg.status+' '+(await rg.text()).slice(0,140));
    var dg=await rg.json(); resposta=((dg.candidates&&dg.candidates[0]&&dg.candidates[0].content&&dg.candidates[0].content.parts)||[]).map(function(p){ return p.text||''; }).join('');
  } else { // openai-compatível: openai, deepseek, grok
    var base=BASEURL[ag.provider]||BASEURL.openai;
    var ro=await fetch(base+'/chat/completions',{ method:'POST', headers:{'content-type':'application/json','authorization':'Bearer '+key}, body:JSON.stringify({ model:model, messages:[{role:'system',content:ag.system}].concat(hist) }) });
    if(!ro.ok) throw new Error(ag.provider+' '+ro.status+' '+(await ro.text()).slice(0,140));
    var dox=await ro.json(); resposta=dox.choices[0].message.content;
  }
  hist.push({role:'assistant', content:resposta});
  if(hist.length>20) AGENTS.__hist[id]=hist.slice(-20);
  return resposta;
}

async function enviar(){
  var txt=document.getElementById('fala-txt').value.trim();
  if(!txt){ setStatus('⚠ Digite ou fale algo para enviar',''); return; }
  var ag=AGENTS[agente];
  if(!temChave(agente)){
    setStatus('⚠ '+ag.nome+' sem chave API — abra ⚙. Por ora, cole a resposta dele.','err');
    abrirConfig(); return;
  }
  var btn=document.getElementById('btn-enviar'); btn.disabled=true;
  setStatus('⏳ '+ag.nome+' pensando…','on');
  try{
    var resp=await chamarLLM(agente, txt);
    leituraOrig=resp; buildLeitura(resp);
    document.getElementById('fala-txt').value=''; textoBase=''; salvarBackup(); atualizarCopiar();
    setStatus('✅ '+ag.nome+' respondeu — ▶ para ouvir','');
    setTimeout(function(){ togglePlay(); }, 250);
  }catch(e){ console.error(e); setStatus('❌ '+e.message,'err'); }
  finally{ btn.disabled=false; }
}

/* ════════════════════ MODAL CONFIG ════════════════════ */
function montarConfig(){
  var c=document.getElementById('cfg-lista'); if(!c) return; c.innerHTML='';
  ORDER.forEach(function(id){
    var ag=AGENTS[id];
    var provLabel={anthropic:'Claude · Anthropic',openai:'ChatGPT · OpenAI',deepseek:'DeepSeek',grok:'Grok · xAI',gemini:'Gemini · Google'}[ag.provider]||ag.provider;
    var opts='<option value="">— voz automática —</option>';
    vozes.forEach(function(v){ var sel=(localStorage.getItem('triv_voice_'+id)===v.name)?' selected':''; opts+='<option value="'+escHTML(v.name)+'"'+sel+'>'+escHTML(v.name)+' ('+v.lang+')</option>'; });
    var div=document.createElement('div'); div.className='cfg-ag'; div.style.setProperty('--ac', ag.cor);
    div.innerHTML=
      '<h3>'+ag.emoji+' '+ag.nome+'<span class="meta">'+provLabel+'</span></h3>'+
      '<div class="cfg-cols">'+
        '<div class="cfg-row"><label>Chave API</label><input type="password" id="cfg-key-'+id+'" placeholder="cole a chave" value="'+escHTML(chave(id))+'"></div>'+
        '<div class="cfg-row"><label>Modelo</label><input type="text" id="cfg-model-'+id+'" value="'+escHTML(modeloDe(id))+'"></div>'+
      '</div>'+
      '<div class="cfg-row"><label>Voz</label><select id="cfg-voice-'+id+'">'+opts+'</select></div>';
    c.appendChild(div);
  });
}
function abrirConfig(){ montarConfig(); document.getElementById('modal').classList.add('on'); }
function fecharConfig(){ document.getElementById('modal').classList.remove('on'); }
function salvarConfig(){
  ORDER.forEach(function(id){
    var k=document.getElementById('cfg-key-'+id).value.trim();
    var m=document.getElementById('cfg-model-'+id).value.trim();
    var v=document.getElementById('cfg-voice-'+id).value;
    if(k) localStorage.setItem('triv_key_'+id,k); else localStorage.removeItem('triv_key_'+id);
    if(m) localStorage.setItem('triv_model_'+id,m);
    if(v) localStorage.setItem('triv_voice_'+id,v); else localStorage.removeItem('triv_voice_'+id);
  });
  montarAbas(); setAgente(agente); fecharConfig(); setStatus('✅ Configurações salvas','');
}

/* ════════════════════ ATALHOS E INIT ════════════════════ */
document.getElementById('area-l').addEventListener('paste',function(e){ e.preventDefault(); var txt=e.clipboardData&&e.clipboardData.getData('text/plain'); if(txt&&txt.trim()){ leituraOrig=txt; buildLeitura(txt); } });
document.getElementById('fala-txt').addEventListener('input',function(){ textoBase=this.value; salvarBackup(); atualizarCopiar(); });
document.addEventListener('keydown',function(e){
  var naTxt=document.activeElement&&(document.activeElement.id==='fala-txt'||document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='SELECT');
  if(e.code==='Space'&&!naTxt){ e.preventDefault(); toggleGravar(); }
  if(e.code==='Escape'){ if(document.getElementById('modal').classList.contains('on')) fecharConfig(); else pararLeitura(); }
});
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') fecharConfig(); });

(function init(){
  montarAbas(); setAgente('claudio');
  var b=''; try{ b=localStorage.getItem('triv_fala')||''; }catch(x){}
  if(b){ document.getElementById('fala-txt').value=b; textoBase=b; atualizarCopiar(); }
  if(!SR){ setStatus('Pronto. (Ditar só no Chrome/Edge)',''); }
  else { setStatus('Pronto. Espaço para ditar · ⚙ para configurar chaves',''); }
})();
</script>
