function vozDe(id){ var ag=AGENTS[id]; if(!vozes.length) vozes=speechSynthesis.getVoices(); var sv=localStorage.getItem('triv_voice_'+id); if(sv){var v0=vozes.find(function(v){return v.name===sv;}); if(v0) return v0;} for(var i=0;i<ag.voiceHint.length;i++){var h=ag.voiceHint[i];var v=vozes.find(function(v){return v.name.toLowerCase().includes(h);});if(v)return v;} return vozes.find(function(v){return v.lang&&v.lang.toLowerCase().startsWith('pt');})||vozes[0]||null; }

/* ═══════════ TEXTO ═══════════ */
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripUrls(t){ return t.replace(/https?:\/\/[^\s<>"'»«\]]+/g,'').replace(/www\.[^\s<>"'»«\]]+/g,'').replace(/\s{2,}/g,' ').trim(); }

function stripMD(t){ return t.replace(/\*\*(.*?)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/__(.*?)__/g,'$1').trim(); }
function stripAbs(t){ return t.replace(/[A-Za-z]:[\\\/][^\s,;'"<>&\n]*/g,'').replace(/\/(?:Users|home|var|etc|opt|usr|tmp|root|mnt|srv|bin|lib)[^\s,;'"<>&\n]*/g,''); }
function stripRel(t){ return t.replace(/\.{1,2}\/[\w.\-\/]+/g,'').replace(/\b[\w-]+(?:\/[\w-]+)+\.[A-Za-z0-9]{1,6}\b/g,'').replace(/\b[\w-]+\/[\w./-]*\.[A-Za-z0-9]{1,6}\b/g,''); }
function stripEnderecos(t){ return stripAbs(stripRel(t)).replace(/\s{2,}/g,' ').trim(); }
function stripJunk(t){ return t.replace(/`[^`\n]+`/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^#{1,6}\s+/gm,'').replace(/^[-*]\s+/gm,'').replace(/^[ \t]*([+\-=\/\\|*_#~]{3,})[ \t]*$/gm,'').replace(/\n{2,}/g,'. ').replace(/\n/g,' ').replace(/\s{2,}/g,' ').trim(); }
function renderMDi(t){ return escHTML(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function parseSegments(raw){ var segs=[],txt=raw.replace(/\r\n/g,'\n').replace(/\r/g,'\n');var re=/```([^\n]*)[ \t]*\n([\s\S]*?)```/g,last=0,m;while((m=re.exec(txt))!==null){if(m.index>last)segs.push({type:'text',content:txt.slice(last,m.index)});segs.push({type:'code',lang:(m[1]||'code').trim(),content:m[2].trim()});last=m.index+m[0].length;}if(last<txt.length)segs.push({type:'text',content:txt.slice(last)});return segs; }
function highlightCode(raw,lang){
  var l=(lang||'').toLowerCase();
  var kwJS=/^(function|var|const|let|if|else|return|for|while|do|class|new|this|typeof|instanceof|import|export|default|from|of|in|try|catch|finally|throw|async|await|yield|switch|case|break|continue|null|undefined|true|false|void|delete|require|module|console|Promise|Object|Array|Math|JSON|process|window|document)\b/;
  var kwPY=/^(def|class|if|elif|else|return|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|pass|break|continue|lambda|yield|True|False|None|self|super|print|len|range|type|str|int|float|list|dict|set|tuple)\b/;
  var kwMQL=/^(input|extern|datetime|color|bool|int|double|string|void|long|ulong|uchar|enum|struct|class|if|else|for|while|switch|case|break|continue|return|true|false|NULL|OrderSend|iMA|iRSI|OnTick|OnInit|OnDeinit)\b/;
  var kwRe=/^py/.test(l)?kwPY:/(mq|mt|mql)/.test(l)?kwMQL:kwJS;
  var bi=/^(console\.log|console\.error|document\.getElementById|require|setTimeout|setInterval|parseInt|parseFloat|isNaN|fetch|JSON\.parse|JSON\.stringify|Object\.keys|Math\.floor|Math\.round)\b/;
  var pats;
  if(/^html?$/i.test(l)){pats=[{t:'cmt',r:/^<!--[\s\S]*?-->/},{t:'tag',r:/^<\/?[\w:-]+/},{t:'pun',r:/^\/?>/},{t:'atr',r:/^[\w:-]+(?=\s*=)/},{t:'str',r:/^"[^"]*"/},{t:'str',r:/^'[^']*'/},{t:'num',r:/^\b\d+\.?\d*\b/},{t:null,r:/^[\s\S]/}];}

  var out='',rem=raw;while(rem.length){for(var i=0;i<pats.length;i++){var m=pats[i].r.exec(rem);if(m){var x=escHTML(m[0]);out+=pats[i].t?'<span class="ck-'+pats[i].t+'">'+x+'</span>':x;rem=rem.slice(m[0].length);break;}}}return out;

function renderMsg(raw){

        var ln=line.trim(); if(!ln) return;
        if(/^\|.+\|/.test(ln)){ if(/^[\s|:-]+$/.test(ln)) return; var cells=ln.split('|').slice(1,-1).map(function(c){return c.trim();}).filter(Boolean); if(cells.length) html+='<div class="li">'+cells.map(function(c){return renderMDi(c);}).join(' · ')+'</div>'; return; }
        var hm=ln.match(/^(#{1,4})\s+(.+)/); if(hm){var t=Math.min(hm[1].length+2,4); html+='<h'+t+'>'+renderMDi(hm[2])+'</h'+t+'>'; return;}
        if(/^[-*•]\s+/.test(ln)){ html+='<div class="li">› '+renderMDi(ln.replace(/^[-*•]\s+/,''))+'</div>'; return; }
        html+='<p>'+renderMDi(ln)+'</p>';
      });
    }
  });
  return html||'<p></p>';
}

/* ═══════════ TTS ═══════════ */
function _utt(text,id,fila){
  var t=text;
  if(semCod) t=t.replace(/```[\s\S]*?```/g,' ').replace(/`[^`\n]+`/g,' ');
  if(semEnd) t=stripEnderecos(t);
  if(semUrl) t=stripUrls(t);
  t=removeEmojis(stripJunk(t)); if(!t.trim()) return;
  var u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; u.rate=rateDe(id); u.pitch=pitchDe(id);
  var v=vozDe(id); if(v) u.voice=v;
  speechSynthesis.speak(u);
}
function falar(text,id){ speechSynthesis.cancel(); _utt(text,id,false); }   // ouvir agora
function falarFila(text,id){ _utt(text,id,true); }                         // enfileira (auto)
function pararFala(){ speechSynthesis.cancel(); setStatus(''); }

/* ═══════════ JANELA (drag + recolher) ═══════════ */
function layout(){ try{ return JSON.parse(localStorage.getItem('triv_layout')||'{}'); }catch(x){ return {}; } }
function salvarLayout(o){ try{ localStorage.setItem('triv_layout',JSON.stringify(o)); }catch(x){} }
function setPos(el,x,y){ el.style.left=Math.max(0,x)+'px'; el.style.top=Math.max(0,y)+'px'; }
function frente(el){ el.style.zIndex=++zTop; document.querySelectorAll('.win').forEach(function(w){w.classList.remove('foco');}); el.classList.add('foco'); }
function persistir(id,el){ var L=layout(); var b=el.querySelector('.body'); L[id]={x:parseInt(el.style.left)||0,y:parseInt(el.style.top)||0,w:b?b.style.width:'',h:b?b.style.height:'',col:el.classList.contains('col')}; salvarLayout(L); }
function arrastavel(el,id){
  var bar=el.querySelector('.tbar'), sx,sy,ox,oy,moved;
  bar.addEventListener('pointerdown',function(e){
    if(e.target.closest('.wbtn')) return;
    frente(el); moved=false; sx=e.clientX; sy=e.clientY; ox=parseInt(el.style.left)||0; oy=parseInt(el.style.top)||0;
    bar.setPointerCapture(e.pointerId);
    function mv(ev){ var dx=ev.clientX-sx,dy=ev.clientY-sy; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; setPos(el,ox+dx,oy+dy); }
    function up(){ try{bar.releasePointerCapture(e.pointerId);}catch(x){} bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); if(moved) persistir(id,el); }
    bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up);
  });
}
function recolher(id){ var el=document.getElementById(id==='dock'?'dock':id==='sala'?'sala':id); el.classList.toggle('col'); var ic=el.querySelector('.cl-ico'); if(ic) ic.textContent=el.classList.contains('col')?'▸':'▾'; persistir(id,el); }

/* ═══════════ SALA (janela compartilhada) ═══════════ */
function criarSala(){
  var cv=document.getElementById('canvas');
  var el=document.createElement('div'); el.className='win'; el.id='sala'; el.style.setProperty('--wc','#8ea2ff'); el.style.setProperty('--wbg','rgba(99,102,241,.12)');
  el.innerHTML='<div class="tbar"><span class="ttl">🜲 Sala — todos juntos</span><span class="tsp"></span>'+
    '<button class="wbtn" title="Parar fala" onclick="pararFala()">⏹</button>'+
    '<button class="wbtn" title="Limpar conversa" onclick="limparSala()">🗑</button>'+
    '<button class="wbtn cl-ico" title="Recolher" onclick="recolher(\'sala\')">▾</button></div>'+
    '<div class="body" id="sala-body"><div class="vaziop">🜲 Mesa redonda do TRIVIUM369.<br>Escolha quem responde (1–5 ou Todos), fale 🎙 ou escreva, e mande.<br>Os agentes veem a conversa e dialogam entre si.</div></div>';
  cv.appendChild(el); arrastavel(el,'sala'); el.addEventListener('pointerdown',function(){ frente(el); });
}
function addLinha(from,text,pend){
  var b=document.getElementById('sala-body'); var v=b.querySelector('.vaziop'); if(v) v.remove();
  var ronei=(from==='ronei');
  var ln=document.createElement('div'); ln.className='line '+(ronei?'ronei':'ag');
  ln.style.setProperty('--lc', ronei?'#34d399':AGENTS[from].cor);
  var who=document.createElement('div'); who.className='who'; who.textContent=ronei?'Você ▸':(AGENTS[from].emoji+' '+AGENTS[from].nome);
  var bub=document.createElement('div'); bub.className='bub'+(pend?' pend':'');
  if(ronei) bub.textContent=text; else bub.innerHTML=pend?escHTML(text):renderMsg(text);
  ln.appendChild(who); ln.appendChild(bub);
  if(!ronei&&!pend) ln.appendChild(miniAcoes(from,text));
  b.appendChild(ln); b.scrollTop=b.scrollHeight;
  return {ln:ln,bub:bub};
}
function miniAcoes(id,text){ var d=document.createElement('div'); d.className='mini';
  var a=document.createElement('button'); a.className='mbtn2'; a.textContent='🔊'; a.onclick=function(){ falar(text,id); };
  var c=document.createElement('button'); c.className='mbtn2'; c.textContent='📋'; c.onclick=function(){ navigator.clipboard.writeText(text); setStatus('✅ copiado'); };
  d.appendChild(a); d.appendChild(c); return d; }
function limparSala(){ pararFala(); salaLog=[]; salvarSala(); document.getElementById('sala-body').innerHTML='<div class="vaziop">Conversa limpa. Manda a próxima. 🜲</div>'; }
function salvarSala(){ try{ localStorage.setItem('triv_sala', JSON.stringify(salaLog.slice(-120))); }catch(x){} }
function restaurarSala(){ var raw=''; try{ raw=localStorage.getItem('triv_sala')||''; }catch(x){} if(!raw) return; try{ salaLog=JSON.parse(raw)||[]; }catch(x){ salaLog=[]; } salaLog.forEach(function(m){ addLinha(m.from,m.text); }); }

/* ═══════════ CONTEXTO COMPARTILHADO ═══════════ */
function contextoPara(id){
  var msgs=[];
  salaLog.slice(-40).forEach(function(e){
    if(e.from===id){ msgs.push({role:'assistant',content:e.text}); }
    else{ var nome=(e.from==='ronei')?'Ronei':AGENTS[e.from].nome; msgs.push({role:'user',content:nome+': '+e.text}); }
  });
  var out=[]; msgs.forEach(function(m){ if(out.length&&out[out.length-1].role===m.role) out[out.length-1].content+='\n\n'+m.content; else out.push({role:m.role,content:m.content}); });
  if(!out.length||out[0].role==='assistant') out.unshift({role:'user',content:'(início da sala)'});
  return out;
}

/* ═══════════ LLM ═══════════ */
function temChave(id){ return !!localStorage.getItem('triv_key_'+id); }
function chave(id){ return localStorage.getItem('triv_key_'+id)||''; }
function modeloDe(id){ return localStorage.getItem('triv_model_'+id)||AGENTS[id].model; }
async function chamarLLM(id){
  var ag=AGENTS[id],key=chave(id),model=modeloDe(id), ctx=contextoPara(id), resp='';
  if(ag.provider==='anthropic'){
    var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:model,max_tokens:4096,system:ag.system,messages:ctx})});
    if(!r.ok) throw new Error('Anthropic '+r.status+' '+(await r.text()).slice(0,110)); var d=await r.json(); resp=(d.content||[]).map(function(b){return b.text||'';}).join('');
  }else if(ag.provider==='gemini'){
    var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key);
    var contents=ctx.map(function(m){return {role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]};});
    var rg=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:ag.system}]},contents:contents})});
    if(!rg.ok) throw new Error('Gemini '+rg.status+' '+(await rg.text()).slice(0,110)); var dg=await rg.json(); resp=((dg.candidates&&dg.candidates[0]&&dg.candidates[0].content&&dg.candidates[0].content.parts)||[]).map(function(p){return p.text||'';}).join('');
  }else{
    var base=BASEURL[ag.provider]||BASEURL.openai;
    var ro=await fetch(base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key},body:JSON.stringify({model:model,messages:[{role:'system',content:ag.system}].concat(ctx)})});
    if(!ro.ok) throw new Error(ag.provider+' '+ro.status+' '+(await ro.text()).slice(0,110)); var dox=await ro.json(); resp=dox.choices[0].message.content;
  }
  return resp;
}

/* faz um agente responder à sala atual (sequencial → eles se ouvem) */
async function responder(id){
  var pend=addLinha(id,'…',true);
  try{
    var r=await chamarLLM(id);
    pend.bub.classList.remove('pend'); pend.bub.innerHTML=renderMsg(r); pend.ln.appendChild(miniAcoes(id,r));
    salaLog.push({from:id,text:r}); salvarSala(); document.getElementById('sala-body').scrollTop=document.getElementById('sala-body').scrollHeight;
    if(autoOuvir) falarFila(r,id);
  }catch(e){ pend.bub.classList.remove('pend'); pend.bub.classList.add('erro'); pend.bub.textContent='❌ '+e.message; }
}

async function enviar(){
  if(ocupado) return;
  var ent=document.getElementById('entrada'); var txt=ent.value.trim(); if(!txt) return;
  ent.value=''; ent.style.height='auto';
  salaLog.push({from:'ronei',text:txt}); addLinha('ronei',txt); salvarSala();
  var alvos=ORDER.filter(function(id){ return destinos.has(id); });
  if(!alvos.length){ setStatus('escolha quem responde (1–5)','err'); return; }
  var semCh=alvos.filter(function(id){ return !temChave(id); });
  semCh.forEach(function(id){ var b=addLinha(id,'sem chave API — configure em ⚙',false); b.bub.classList.add('erro'); });
  var comChave=alvos.filter(temChave);
  if(!comChave.length){ setStatus('nenhum selecionado tem chave — ⚙','err'); abrirConfig(); return; }
  ocupado=true; if(autoOuvir) speechSynthesis.cancel();
  for(var i=0;i<comChave.length;i++){ setStatus('⏳ '+AGENTS[comChave[i]].nome+' falando…','on'); await responder(comChave[i]); } // sequencial: cada um vê o anterior
  ocupado=false; setStatus('pronto');
}

/* mais uma rodada: os agentes selecionados reagem ao que já foi dito (sem nova fala do Ronei) */
async function rodada(){
  if(ocupado){ return; }
  if(!salaLog.length){ setStatus('mande algo primeiro',''); return; }
  var comChave=ORDER.filter(function(id){ return destinos.has(id)&&temChave(id); });
  if(!comChave.length){ setStatus('selecione quem debate (com chave)','err'); return; }
  ocupado=true; if(autoOuvir) speechSynthesis.cancel();
  for(var i=0;i<comChave.length;i++){ setStatus('🗣️ '+AGENTS[comChave[i]].nome+' rebatendo…','on'); await responder(comChave[i]); }
  ocupado=false; setStatus('pronto');
}

/* ═══════════ DOCK ═══════════ */
function criarDock(){
  var cv=document.getElementById('canvas');
  var el=document.createElement('div'); el.className='win'; el.id='dock';
  el.innerHTML='<div class="tbar"><span class="ttl">🎙 Ronei — sua estação</span><span class="tsp"></span>'+
    '<button class="wbtn cl-ico" title="Recolher" onclick="recolher(\'dock\')">▾</button></div>'+
    '<div class="body"><div id="chips"></div>'+
      '<div class="docrow">'+
        '<button class="cbig" id="mic" onclick="toggleMic()" title="Ditar (Espaço)">🎙</button>'+
        '<textarea id="entrada" rows="1" placeholder="Fale ou escreva para a sala…"></textarea>'+
        '<button class="cbig" id="send" onclick="enviar()" title="Enviar (Enter)">➤</button>'+
      '</div><button id="rodada" onclick="rodada()" title="Os selecionados reagem ao que já foi dito">🗣️ mais uma rodada</button><div id="interim"></div></div>';
  cv.appendChild(el); arrastavel(el,'dock'); el.addEventListener('pointerdown',function(){ frente(el); });
  var ent=el.querySelector('#entrada');
  ent.addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,160)+'px'; if(!gravando) baseTxt=this.value; });
  ent.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); enviar(); } });
}
function montarChips(){
  var c=document.getElementById('chips'); if(!c) return; c.innerHTML='';
  ORDER.forEach(function(id,i){ var ag=AGENTS[id]; var ch=document.createElement('div'); ch.className='chip'+(destinos.has(id)?' ativo':''); ch.id='chip-'+id; ch.style.setProperty('--ac',ag.cor); ch.onclick=function(){ toggleDestino(id); };
    ch.innerHTML='<span class="k">'+(i+1)+'</span>'+ag.emoji+' '+ag.nome+'<span class="api'+(temChave(id)?' ok':'')+'"></span>'; c.appendChild(ch); });
  var t=document.createElement('div'); t.className='chip'+(destinos.size===ORDER.length?' ativo':''); t.id='chip-todos'; t.textContent='Todos'; t.onclick=toggleTodos; c.appendChild(t);
}
function toggleDestino(id){ if(destinos.has(id)) destinos.delete(id); else destinos.add(id); if(destinos.size===0) destinos.add(id); montarChips(); }
function toggleTodos(){ destinos = destinos.size===ORDER.length ? new Set(['claudio']) : new Set(ORDER.slice()); montarChips(); }

/* ═══════════ SUPRESSÃO / AUTO ═══════════ */
function toggleSup(t){ if(t==='cod')semCod=!semCod; else if(t==='end')semEnd=!semEnd; else if(t==='url')semUrl=!semUrl;
  document.getElementById('t-cod').classList.toggle('on',semCod); document.getElementById('t-end').classList.toggle('on',semEnd); document.getElementById('t-url').classList.toggle('on',semUrl); }
function toggleAuto(){ autoOuvir=!autoOuvir; document.getElementById('t-spk').classList.toggle('on',autoOuvir); setStatus(autoOuvir?'auto-ouvir ligado':'auto-ouvir desligado'); }

/* ═══════════ DITADO ═══════════ */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, gravando=false, baseTxt='';
var DIC={'claudio':'Claudio','cláudio':'Claudio','roney':'Ronei','ronei':'Ronei','cairos':'Kairos','kairos':'Kairos','pedrin':'Pedrinho','marcão':'Marcão','marcao':'Marcão','marcos':'Marcão','chatinha':'Chatinha','xatinha':'Chatinha','trivium':'TRIVIUM369','eurusd':'EURUSD','gbpusd':'GBPUSD','xauusd':'XAUUSD','btcusd':'BTCUSD'};
function corrigir(t){ for(var k in DIC){ t=t.replace(new RegExp('\\b'+k+'\\b','gi'),DIC[k]); } return t; }
function initRec(){ rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=function(e){ if(!gravando) return; var ent=document.getElementById('entrada'),ib=document.getElementById('interim'),parcial='';
    for(var i=e.resultIndex;i<e.results.length;i++){ var t=corrigir(e.results[i][0].transcript.trim()); if(e.results[i].isFinal){ ent.value=(baseTxt?baseTxt+' ':'')+t; baseTxt=ent.value; ent.style.height='auto'; ent.style.height=Math.min(ent.scrollHeight,160)+'px'; } else parcial=t; }
    ib.textContent=parcial?'◉ '+parcial:''; };
  rec.onerror=function(e){ if(e.error==='no-speech'||e.error==='aborted') return; setStatus('⚠ '+e.error,'err'); };
  rec.onend=function(){ if(gravando) setTimeout(function(){ try{rec.start();}catch(x){} },200); };
  try{ rec.start(); }catch(x){}
}
function toggleMic(){ gravando?pararMic():iniciarMic(); }
function iniciarMic(){ if(!SR){ setStatus('❌ ditado só no Chrome/Edge','err'); return; } gravando=true; baseTxt=document.getElementById('entrada').value; if(!rec) initRec(); else try{rec.start();}catch(x){} document.getElementById('mic').classList.add('ativo'); document.getElementById('dot').className='on'; setStatus('🎙 ouvindo…','on'); var e=document.getElementById('entrada'); if(e) e.focus(); }
function pararMic(){ gravando=false; try{ if(rec) rec.stop(); }catch(x){} var m=document.getElementById('mic'); if(m) m.classList.remove('ativo'); document.getElementById('dot').className=''; var ib=document.getElementById('interim'); if(ib) ib.textContent=''; setStatus(''); }
function setStatus(msg,cls){ document.getElementById('status').textContent=msg||''; document.getElementById('dot').className=cls==='on'?'on':cls==='err'?'err':(gravando?'on':''); }

/* ═══════════ CONFIG ═══════════ */
function montarConfig(){ var c=document.getElementById('cfg-lista'); if(!c) return; c.innerHTML='';
  ORDER.forEach(function(id){ var ag=AGENTS[id]; var opts='<option value="">— voz automática —</option>';
    vozes.forEach(function(v){ var sel=(localStorage.getItem('triv_voice_'+id)===v.name)?' selected':''; opts+='<option value="'+escHTML(v.name)+'"'+sel+'>'+escHTML(v.name)+' ('+v.lang+')</option>'; });
    var div=document.createElement('div'); div.className='cfg-ag'; div.style.setProperty('--ac',ag.cor);
    div.innerHTML='<h3>'+ag.emoji+' '+ag.nome+'<span class="meta">'+(PROVLBL[ag.provider]||ag.provider)+'</span></h3>'+
      '<div class="cfg-cols"><div class="cfg-row"><label>Chave API</label><input type="password" id="cfg-key-'+id+'" placeholder="cole a chave" value="'+escHTML(chave(id))+'"></div>'+
      '<div class="cfg-row"><label>Modelo</label><input type="text" id="cfg-model-'+id+'" value="'+escHTML(modeloDe(id))+'"></div></div>'+
      '<div class="cfg-row"><label>Voz</label><select id="cfg-voice-'+id+'">'+opts+'</select></div>'; c.appendChild(div); });
}
function abrirConfig(){ montarConfig(); document.getElementById('modal').classList.add('on'); }
function fecharConfig(){ document.getElementById('modal').classList.remove('on'); }
function salvarConfig(){ ORDER.forEach(function(id){ var k=document.getElementById('cfg-key-'+id).value.trim(); var m=document.getElementById('cfg-model-'+id).value.trim(); var v=document.getElementById('cfg-voice-'+id).value;
    if(k) localStorage.setItem('triv_key_'+id,k); else localStorage.removeItem('triv_key_'+id);
    if(m) localStorage.setItem('triv_model_'+id,m);
    if(v) localStorage.setItem('triv_voice_'+id,v); else localStorage.removeItem('triv_voice_'+id); });
  montarChips(); fecharConfig(); setStatus('✅ salvo');
}

/* ═══════════ LAYOUT / INIT ═══════════ */
function aplicarLayout(){ var L=layout(); ['sala','dock'].forEach(function(id){ var el=document.getElementById(id); if(!el) return;
    if(L[id]){ setPos(el,L[id].x,L[id].y); var b=el.querySelector('.body'); if(b){ if(L[id].w)b.style.width=L[id].w; if(L[id].h)b.style.height=L[id].h; } if(L[id].col){ el.classList.add('col'); var ic=el.querySelector('.cl-ico'); if(ic) ic.textContent='▸'; } } });
  if(!L.sala||!L.dock) organizar();
}
function organizar(){
  var cv=document.getElementById('canvas'), W=cv.clientWidth, H=cv.clientHeight, gap=12, dockH=178;
  var sala=document.getElementById('sala'); sala.classList.remove('col'); var si=sala.querySelector('.cl-ico'); if(si) si.textContent='▾';
  var sw=Math.min(820,W-2*gap), sh=H-dockH-3*gap-46;
  var sb=sala.querySelector('.body'); sb.style.width=sw+'px'; sb.style.height=Math.max(160,sh)+'px'; setPos(sala,(W-sw)/2,gap);
  var dock=document.getElementById('dock'); dock.classList.remove('col'); var di=dock.querySelector('.cl-ico'); if(di) di.textContent='▾';
  var dw=Math.min(660,W-2*gap); dock.querySelector('.body').style.width=dw+'px'; setPos(dock,(W-dw)/2,H-dockH-gap);
  var Lo={}; ['sala','dock'].forEach(function(id){ var el=document.getElementById(id); var bb=el.querySelector('.body'); Lo[id]={x:parseInt(el.style.left)||0,y:parseInt(el.style.top)||0,w:bb.style.width,h:bb.style.height,col:false}; }); salvarLayout(Lo);
}

document.addEventListener('keydown',function(e){
  var d=document.activeElement, naDigit=d&&(d.tagName==='TEXTAREA'||d.tagName==='INPUT'||d.tagName==='SELECT');
  if(e.code==='Escape'){ if(document.getElementById('modal').classList.contains('on')) fecharConfig(); else pararFala(); return; }
  if(naDigit) return;
  if(e.code==='Space'){ e.preventDefault(); toggleMic(); return; }
  if(/^Digit[1-5]$/.test(e.code)){ var n=parseInt(e.code.slice(5))-1; if(ORDER[n]) toggleDestino(ORDER[n]); }
  if(e.key==='t'||e.key==='T'){ toggleTodos(); }
});
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') fecharConfig(); });

(function init(){
  criarSala(); criarDock(); montarChips(); aplicarLayout(); restaurarSala();
  setStatus(SR?'pronto · Espaço dita · 1–5 quem responde · 🗣️ mais uma rodada · ⚙ chaves':'pronto · (ditado só Chrome/Edge) · ⚙ chaves');
})();
</script>
